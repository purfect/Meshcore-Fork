name: Firmware Builder

on:
  workflow_call:
    inputs:
      firmware_type:
        required: true
        type: string
      release_title_prefix:
        required: true
        type: string
      release_draft:
        required: false
        default: true
        type: boolean
      firmware_targets:
        required: false
        default: ''
        type: string

jobs:

  generate-build-matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.get-build-targets.outputs.targets }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Get Build Targets
        id: get-build-targets
        env:
          REQUESTED_TARGETS: ${{ inputs.firmware_targets }}
        run: |
          if [[ -n "$REQUESTED_TARGETS" ]]; then
            # A caller can explicitly limit the matrix to avoid building every supported board.
            JSON_ARRAY=$(echo "$REQUESTED_TARGETS" | jq -c '
              if type != "array" or length == 0 or length > 8 or any(.[]; type != "string")
              then error("firmware_targets must contain between 1 and 8 target names")
              else . end')
          else
            # Keep the reusable upstream default for workflows without an explicit target list.
            TARGET_LIST=$(/usr/bin/env bash build.sh get-${{ inputs.firmware_type }}-firmwares-to-build)
            JSON_ARRAY=$(echo "$TARGET_LIST" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          
          # use json array as targets result
          echo "targets=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build:
    needs: generate-build-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJson(needs.generate-build-matrix.outputs.targets) }}
      max-parallel: 5
      fail-fast: false # don't cancel other builds if one board fails to build
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ env.GIT_TAG_VERSION }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.target }}

      - name: Verify MeshCore Web Flasher package
        shell: bash
        run: |
          shopt -s nullglob
          merged_bins=(out/*-merged.bin)
          all_bins=(out/*.bin)
          update_bins=()
          dfu_zips=(out/*.zip)

          for firmware_file in "${all_bins[@]}"; do
            if [[ "$firmware_file" != *-merged.bin ]]; then
              update_bins+=("$firmware_file")
            fi
          done

          if (( ${#merged_bins[@]} > 0 )); then
            if (( ${#update_bins[@]} == 0 )); then
              echo "ESP32 build is missing the non-merged update BIN." >&2
              exit 1
            fi

            echo "### MeshCore Web Flasher: ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Fresh install/recovery: \`${merged_bins[0]#out/}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Update preserving settings: \`${update_bins[0]#out/}\`" >> "$GITHUB_STEP_SUMMARY"
          elif (( ${#dfu_zips[@]} > 0 )); then
            echo "### MeshCore Web Flasher: ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- nRF52 serial DFU: \`${dfu_zips[0]#out/}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No MeshCore Web Flasher compatible .bin or nRF52 OTA .zip was produced." >&2
            exit 1
          fi

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.target }}-firmware"
          path: out

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # only create release for tagged builds
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      - name: Create or update release for pushed tag
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ inputs.release_title_prefix }} ${{ env.GIT_TAG_VERSION }}"
          body: |
            ## MeshCore Web Flasher (https://flasher.meshcore.co.uk/)

            - `*-merged.bin`: Vollflash / Neuinstallation (ESP32) – diese Datei im Web Flasher unter "Custom Firmware" auswählen.
            - `*.bin` (ohne `-merged`): Update, bestehende Einstellungen bleiben erhalten (ESP32).
            - `*.uf2` / `*.zip`: nRF52-Boards (serielles DFU bzw. UF2-Kopie).
            - `*.hex`: STM32-Boards.
          draft: ${{ inputs.release_draft }}
          files: out/*

      - name: Upload firmware to published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: out/*
