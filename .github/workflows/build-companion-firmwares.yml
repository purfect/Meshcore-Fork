name: Build End-Device Companion Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      target_preset:
        description: 'Gerät und Verbindung auswählen'
        required: true
        default: 'Alle sechs BLE-Companion-Ziele'
        type: choice
        options:
          - 'Seeed XIAO ESP32-S3 Wio-SX1262 (BLE Companion)'
          - 'Seeed XIAO ESP32-S3 Wio-SX1262 (BLE Hybrid Companion/Repeater)'
          - 'LilyGO T-Echo (BLE Companion)'
          - 'ThinkNode M3 (BLE Companion)'
          - 'ThinkNode M7 (BLE Companion)'
          - 'Heltec V3 (BLE Companion)'
          - 'Heltec V4 (BLE Companion)'
          - 'Alle sechs BLE-Companion-Ziele'
  push:
    tags:
      - '**'
  release:
    types:
      - published

concurrency:
  group: companion-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-firmware-targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - name: Select requested firmware targets
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          TARGET_PRESET: ${{ inputs.target_preset }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            if [[ "$REF_NAME" == hybrid-* ]]; then
              TARGET_PRESET='Seeed XIAO ESP32-S3 Wio-SX1262 (BLE Hybrid Companion/Repeater)'
            else
              TARGET_PRESET='Alle sechs BLE-Companion-Ziele'
            fi
          fi

          case "$TARGET_PRESET" in
            'Seeed XIAO ESP32-S3 Wio-SX1262 (BLE Companion)')
              TARGETS='["Xiao_S3_WIO_companion_radio_ble"]'
              ;;
            'Seeed XIAO ESP32-S3 Wio-SX1262 (BLE Hybrid Companion/Repeater)')
              TARGETS='["Xiao_S3_WIO_companion_radio_ble_hybrid"]'
              ;;
            'LilyGO T-Echo (BLE Companion)')
              TARGETS='["LilyGo_T-Echo_companion_radio_ble"]'
              ;;
            'ThinkNode M3 (BLE Companion)')
              TARGETS='["ThinkNode_M3_companion_radio_ble"]'
              ;;
            'ThinkNode M7 (BLE Companion)')
              TARGETS='["ThinkNode_M7_companion_radio_ble"]'
              ;;
            'Heltec V3 (BLE Companion)')
              TARGETS='["Heltec_v3_companion_radio_ble"]'
              ;;
            'Heltec V4 (BLE Companion)')
              TARGETS='["heltec_v4_companion_radio_ble"]'
              ;;
            'Alle sechs BLE-Companion-Ziele')
              TARGETS='["Xiao_S3_WIO_companion_radio_ble","LilyGo_T-Echo_companion_radio_ble","ThinkNode_M3_companion_radio_ble","ThinkNode_M7_companion_radio_ble","Heltec_v3_companion_radio_ble","heltec_v4_companion_radio_ble"]'
              ;;
            *)
              echo "Unbekannte Geräteauswahl: $TARGET_PRESET" >&2
              exit 1
              ;;
          esac

          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  build-end-device-firmwares:
    needs: select-firmware-targets
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: 'companion'
      release_title_prefix: 'Companion Firmware'
      release_draft: false
      firmware_targets: ${{ needs.select-firmware-targets.outputs.targets }}
