name: Build End-Device Companion Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      target_preset:
        description: 'Gerät und Verbindung auswählen'
        required: true
        default: 'Alle vier BLE-Companion- und Repeater-Ziele'
        type: choice
        options:
          - 'Seeed XIAO ESP32-S3 Wio-SX1262 (BLE + Repeater)'
          - 'LilyGO T-Echo (BLE + Repeater)'
          - 'ThinkNode M3 (BLE + Repeater)'
          - 'ThinkNode M7 (BLE + Repeater)'
          - 'Alle vier BLE-Companion- und Repeater-Ziele'
  push:
    tags:
      - '**'
  release:
    types:
      - published

concurrency:
  group: companion-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-firmware-targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - name: Select requested firmware targets
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_PRESET: ${{ inputs.target_preset }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            TARGET_PRESET='Alle vier BLE-Companion- und Repeater-Ziele'
          fi

          case "$TARGET_PRESET" in
            'Seeed XIAO ESP32-S3 Wio-SX1262 (BLE + Repeater)')
              TARGETS='["Xiao_S3_WIO_companion_radio_ble","Xiao_S3_WIO_repeater"]'
              ;;
            'LilyGO T-Echo (BLE + Repeater)')
              TARGETS='["LilyGo_T-Echo_companion_radio_ble","LilyGo_T-Echo_repeater"]'
              ;;
            'ThinkNode M3 (BLE + Repeater)')
              TARGETS='["ThinkNode_M3_companion_radio_ble","ThinkNode_M3_repeater"]'
              ;;
            'ThinkNode M7 (BLE + Repeater)')
              TARGETS='["ThinkNode_M7_companion_radio_ble","ThinkNode_M7_repeater"]'
              ;;
            'Alle vier BLE-Companion- und Repeater-Ziele')
              TARGETS='["Xiao_S3_WIO_companion_radio_ble","Xiao_S3_WIO_repeater","LilyGo_T-Echo_companion_radio_ble","LilyGo_T-Echo_repeater","ThinkNode_M3_companion_radio_ble","ThinkNode_M3_repeater","ThinkNode_M7_companion_radio_ble","ThinkNode_M7_repeater"]'
              ;;
            *)
              echo "Unbekannte Geräteauswahl: $TARGET_PRESET" >&2
              exit 1
              ;;
          esac

          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  build-end-device-firmwares:
    needs: select-firmware-targets
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: 'companion'
      release_title_prefix: 'Companion Firmware'
      release_draft: false
      firmware_targets: ${{ needs.select-firmware-targets.outputs.targets }}
